appId: pk.vendora.pos
productName: Vendora
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
extraResources:
  - from: drizzle
    to: drizzle
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
